<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MH South Team Work planner</title>
<meta name="color-scheme" content="dark">
<style>
:root{
  --bg:#0e1117; --panel:#161b24; --panel2:#1c2230; --line:#262e3d; --text:#e7eaf0; --muted:#8a93a6;
  --accent:#6ea8fe; --today:#2b3a5c; --bad:#ff6b6b;
  --cs:dark; --hover:#3a4660; --cardhover:#222a3b; --sum:#cfd5e2; --todayline:#4a68a8; --onaccent:#0b1020; --ws:80%; --wl:75%; --stf:none;
  --msgbg:#2a1d22; --msgline:#5a2f38; --msgtext:#ffb3bb; --infobg:#1b2536; --infoline:#2f4466; --infotext:#b8d0ff;
}
:root[data-theme="light"]{
  --bg:#f3f5f9; --panel:#ffffff; --panel2:#f0f3f9; --line:#d8deea; --text:#1a2130; --muted:#626d83;
  --accent:#2f6fdb; --today:#dbe7ff; --bad:#d23a3a;
  --cs:light; --hover:#a9b5cb; --cardhover:#e4ebf7; --sum:#2d3547; --todayline:#7ea2e6; --onaccent:#ffffff; --ws:70%; --wl:30%; --stf:brightness(.55) saturate(1.5);
  --msgbg:#fde8ea; --msgline:#f1b2ba; --msgtext:#9b2433; --infobg:#e3edfc; --infoline:#a8c2ee; --infotext:#1f4a94;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color-scheme:var(--cs)}
header{position:relative;padding:18px 22px 12px;border-bottom:1px solid var(--line);text-align:center}
h1{margin:0;font-size:26px;font-weight:650;letter-spacing:.2px}
.meta{color:var(--muted);font-size:12.5px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 22px}
.bar .grow{flex:1}
button,select,input[type=search]{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font:inherit}
button{cursor:pointer}
button:hover,select:hover{border-color:var(--hover)}
button:disabled{opacity:.45;cursor:default}
#dl{background:var(--accent);color:var(--onaccent);border-color:var(--accent);font-weight:600}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#title{font-size:18px;font-weight:600;min-width:150px;text-align:center}
.stats{display:flex;gap:16px;color:var(--muted);font-size:12.5px;padding:0 22px 10px;flex-wrap:wrap}
.stats b{color:var(--text)}
.stats .od b{color:var(--bad)}
#msg{margin:0 22px 10px;padding:10px 12px;border-radius:8px;background:var(--msgbg);border:1px solid var(--msgline);color:var(--msgtext);display:none}
#msg.info{background:var(--infobg);border-color:var(--infoline);color:var(--infotext)}
.wrap{padding:0 22px 28px}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow div{color:var(--muted);font-size:12px;padding:4px 6px}
.day{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:128px;padding:6px;display:flex;flex-direction:column;gap:5px}
.day.pad{background:transparent;border-color:transparent}
.day.today{background:var(--today);border-color:var(--todayline)}
.day.over{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--panel2)}
.day.past .dn{color:var(--muted)}
.dn{font-weight:600;font-size:13px;display:flex;justify-content:space-between}
.dn small{color:var(--muted);font-weight:400}
.card{cursor:grab;display:block;text-decoration:none;color:inherit;background:var(--panel2);border:1px solid var(--line);border-left:4px solid hsl(var(--h) 65% 58%);border-radius:7px;padding:5px 7px;font-size:12px}
a.card:hover{border-color:hsl(var(--h) 65% 58%);background:var(--cardhover)}
.card.mv{box-shadow:0 0 0 1px var(--accent)}
.card.dragging{opacity:.35}
div.card{opacity:.85}
.r1{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.who{font-weight:650;font-size:12.5px;color:hsl(var(--h) var(--ws) var(--wl));overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{font-size:10.5px;color:var(--c);white-space:nowrap;filter:var(--stf)}
.no{color:var(--muted);font-size:11.5px;margin-top:1px}
.no .odt{color:var(--bad);margin-left:4px}
.sum{margin-top:2px;color:var(--sum);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.more{background:none;border:1px dashed var(--line);color:var(--accent);font-size:12px;padding:3px}
.no .mvt{color:var(--accent);margin-left:4px}
.ms{position:relative}
.mslist{position:absolute;z-index:30;top:calc(100% + 4px);right:0;min-width:210px;max-height:320px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.mslist label{display:flex;gap:7px;align-items:center;padding:4px 6px;border-radius:5px;cursor:pointer}
.mslist label:hover{background:var(--panel2)}
.mslist small{color:var(--muted);margin-left:auto}
.lnk{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font:inherit;text-decoration:underline}
.stats .lnk{font-weight:700;color:var(--text)}
.stats .od .lnk{color:var(--bad)}
.sec{font-weight:600;margin:6px 2px;display:flex;gap:8px;align-items:baseline}
.sec small{color:var(--muted);font-weight:400}
.mh{margin-top:18px}
.pdStrip{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;max-height:210px;overflow:auto}
.card.mini{width:178px;padding:4px 6px}
.mini .m1{display:flex;justify-content:space-between;gap:4px}
.mini .m1 b{font-size:12px}
.mini .sum{-webkit-line-clamp:1}
.mini small{color:var(--bad);font-size:10.5px}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);z-index:50;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.35)}
#panel[hidden]{display:none}
.ph{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:600}
#pbody{overflow:auto;padding:8px 12px 24px}
.prow{padding:8px 4px;border-bottom:1px solid var(--line)}
.p1{display:flex;justify-content:space-between;gap:8px}
.p1 a,.p1 b{color:var(--accent);font-weight:600;text-decoration:none}
.p1 span{color:var(--muted);font-size:12.5px;text-align:right}
.ps{color:var(--sum);font-size:12.5px;margin-top:2px}
.sub{color:var(--muted);font-size:13px;letter-spacing:.4px}
.corner{position:absolute;right:22px;top:14px;display:flex;flex-direction:column;align-items:flex-end;line-height:1.3}
@media (max-width:980px){.corner{position:static;flex-direction:row;justify-content:center;gap:12px;margin-top:4px}.seg{position:static;margin:0 0 6px}}
.theme{position:absolute;right:22px;top:18px;display:flex;gap:7px;align-items:center;font-size:15px;color:var(--muted);cursor:pointer;user-select:none}
.theme input{position:absolute;opacity:0;width:0;height:0}
.theme i{width:38px;height:20px;border-radius:10px;background:var(--line);position:relative;transition:background .2s}
.theme i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--text);transition:transform .2s}
.theme input:checked+i{background:var(--accent)}
.theme input:checked+i::after{background:#fff;transform:translateX(18px)}
.theme input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
.wd{display:none}
.msb{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mslist .clr{display:block;margin:2px 6px 6px}
.pt{border-collapse:collapse;width:100%;font-size:12.5px;white-space:nowrap}
.pt th{position:sticky;top:0;background:var(--panel);text-align:left;border-bottom:1px solid var(--line);padding:0}
.pt th .sb{background:none;border:0;border-radius:0;padding:7px 8px;color:var(--muted);font:inherit;font-weight:600;cursor:pointer}
.pt th .sb:hover{color:var(--text)}
.pt td{padding:6px 8px;border-bottom:1px solid var(--line)}
.pt a{color:var(--accent);font-weight:600;text-decoration:none}
.ghost{box-shadow:0 8px 20px rgba(0,0,0,.5)}
.touchhint{display:none;margin:0 22px 8px;color:var(--muted);font-size:12.5px}
.seg{display:inline-flex;position:absolute;left:22px;top:18px;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.seg button{border:0;border-radius:0;background:transparent;padding:6px 20px;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--onaccent);font-weight:600}
.pt td.tx{white-space:normal;min-width:180px;max-width:320px}
.dr{display:flex;gap:6px;align-items:center}
.add{width:20px;height:20px;padding:0;line-height:1;border-radius:50%;font-size:14px;color:var(--accent);background:var(--panel2);border:1px solid var(--line);cursor:pointer}
.add:hover{border-color:var(--accent)}
#tf{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}
#tf[hidden]{display:none}
.tfbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;width:min(440px,100%);display:flex;flex-direction:column;gap:10px;max-height:100%;overflow:auto}
.tfbox h2{margin:0 0 4px;font-size:17px}
.tfbox label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.tfbox input,.tfbox textarea,.tfbox select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
.tfst{color:var(--muted);font-size:12.5px}
.tfbox label[hidden]{display:none}
.tfbox input:disabled,.tfbox textarea:disabled{opacity:.65}
.tferr{color:var(--bad);font-size:12.5px;min-height:1em}
.tfbtn{display:flex;gap:8px;align-items:center}
.tfbtn .grow{flex:1}
.tfbtn .pri{background:var(--accent);color:var(--onaccent);border-color:var(--accent);font-weight:600}
@media (max-width:760px){
  header,.bar,.stats,.wrap{padding-left:12px;padding-right:12px}
  #msg{margin-left:12px;margin-right:12px}
  .dow{display:none}
  .grid{grid-template-columns:1fr}
  .day.pad,.day.none.past{display:none}
  .day{min-height:0}
  .day.none{padding:3px 8px}
  .wd{display:inline;color:var(--muted);font-weight:400;font-size:12px}
  .bar{position:relative}
  .ms{position:static}
  .mslist{top:auto;left:12px;right:12px;max-width:none}
  #panel{width:100%}
  .touchhint{margin-left:12px;margin-right:12px}
  .theme{position:static;justify-content:center;margin-bottom:8px}
  .seg{position:static;margin:0 0 6px}
}
@media (hover:none) and (pointer:coarse){
  .card{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  .touchhint{display:block}
  .add{width:30px;height:30px;font-size:17px}
}
</style>
</head>
<body>
<header>
  <div class="seg" id="modeSeg"><button type="button" data-m="tickets" class="on">Tickets</button><button type="button" data-m="tasks">Tasks</button></div>
  <h1>MH South Team Work planner</h1>
  <div class="corner"><span class="sub">by Printo</span><span class="meta" id="updated">Loading data…</span></div>
</header>

<div class="bar">
  <button id="prev" aria-label="Previous month">&#8249; Prev</button>
  <div id="title"></div>
  <button id="next" aria-label="Next month">Next &#8250;</button>
  <button id="today">Today</button>
  <span class="grow"></span>
  <span id="filters" style="display:contents"></span>
  <input id="fQ" type="search" placeholder="Search account, city, product, ticket…">
  <button id="reload">Refresh data</button>
  <button id="reset" disabled>Reset moves</button>
  <button id="dl">Download Excel</button>
  <label class="meta" style="cursor:pointer">Open file…<input id="file" type="file" accept=".xlsx,.xls" hidden></label>
</div>

<div class="stats" id="stats"></div>
<div id="msg" role="status"></div>
<div class="touchhint">Tip: hold a tile for 1 second, then slide it onto a date and release.</div>

<div class="wrap" id="wrap">
  <div id="pdWrap" hidden><div class="sec">Past due <small id="pdCount"></small><small>drag onto today or a later date to re-assign</small></div><div class="pdStrip" id="pdStrip"></div></div>
  <div class="dow"><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div></div>
  <div class="grid" id="grid"></div>
  <div class="sec mh" id="title2"></div>
  <div class="dow"><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div></div>
  <div class="grid" id="grid2"></div>
</div>

<div id="tf" hidden><div class="tfbox" role="dialog" aria-modal="true" aria-labelledby="tfTitle">
  <h2 id="tfTitle">Add task</h2>
  <label>Request date<input type="date" id="tfReq"></label>
  <label>Pending from<input id="tfPf" list="dlPf" autocomplete="off"></label>
  <label>ASM<input id="tfAsm" list="dlAsm" autocomplete="off"></label>
  <label>Task summary<textarea id="tfSum" rows="3"></textarea></label>
  <label>Next followup<input type="date" id="tfDue"></label>
  <label id="tfStW" hidden>Status<select id="tfSt"><option>Open</option><option>Closed</option></select></label>
  <div class="tfst" id="tfStTxt">Status: Open</div>
  <div class="tferr" id="tfErr" role="alert"></div>
  <div class="tfbtn"><button type="button" id="tfDel" hidden>Delete</button><button type="button" id="tfClose" hidden>Mark closed</button><span class="grow"></span><button type="button" id="tfCancel">Cancel</button><button type="button" id="tfSave" class="pri">Save</button></div>
  <datalist id="dlPf"></datalist><datalist id="dlAsm"></datalist>
</div></div>

<aside id="panel" hidden aria-label="Ticket preview"><div class="ph"><span id="ptitle"></span><button id="pclose" type="button" aria-label="Close">&#10005;</button></div><div id="pbody"></div></aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ============ SETTINGS: edit these ============ */
const CONFIG = {
  // Raw link of the Excel file in your PUBLIC GitHub repo. Tip: use a file name without spaces.
  DATA_URL: "https://raw.githubusercontent.com/Printoop/Excel_to_Dshboard/main/04_Refresh_Daily_CRM_30_Days_Work_Planner.xlsx" ,
  // Task tracker Excel (only the sheet "Task" is read), same GitHub repo.
  TASKS_URL: "https://raw.githubusercontent.com/Printoop/Excel_to_Dshboard/main/00_South_Task_Tracker_Printo.xlsx",
  // Used only if a row has no Ticket Link. {id} is replaced with the Id column. Leave empty to disable.
  LINK_TEMPLATE: "",
  // Page re-reads the file automatically every N minutes (0 = off)
  REFRESH_MIN: 10
};
/* ============================================== */

const MON = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad2 = n => String(n).padStart(2, "0");
const keyOf = (y, m, d) => y + "-" + pad2(m + 1) + "-" + pad2(d);

let ALL = [], view = new Date(), loadedAt = null;
view.setDate(1);
const F = {q: ""};
const expanded = new Set();

function parseDate(v){
  if (v == null || v === "") return null;
  if (v instanceof Date) return {y: v.getFullYear(), m: v.getMonth(), d: v.getDate()};
  if (typeof v === "number"){
    const p = XLSX.SSF.parse_date_code(v);
    return p ? {y: p.y, m: p.m - 1, d: p.d} : null;
  }
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})[\/\-\s]([A-Za-z]{3,})[\/\-\s,]*(\d{2,4})$/);
  if (m){
    const mo = MON[m[2].slice(0, 3).toLowerCase()];
    if (mo == null) return null;
    let y = +m[3]; if (y < 100) y += 2000;
    return {y, m: mo, d: +m[1]};
  }
  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
  if (m) return {y: +m[3], m: +m[2] - 1, d: +m[1]};
  const t = new Date(s);
  return isNaN(t) ? null : {y: t.getFullYear(), m: t.getMonth(), d: t.getDate()};
}

function safeUrl(u){
  u = String(u || "").trim();
  return /^https?:\/\//i.test(u) ? u : "";
}

function parseWorkbook(wb){
  for (const name of wb.SheetNames){
    const ws = wb.Sheets[name];
    if (!ws || !ws["!ref"]) continue;
    const rng = XLSX.utils.decode_range(ws["!ref"]);
    let hr = -1, cols = {};
    for (let r = rng.s.r; r <= Math.min(rng.e.r, rng.s.r + 40) && hr < 0; r++){
      const found = {};
      for (let c = rng.s.c; c <= Math.min(rng.e.c, 60); c++){
        const cell = ws[XLSX.utils.encode_cell({r, c})];
        if (cell && cell.v != null) found[String(cell.v).replace(/\s+/g, " ").trim().toLowerCase()] = c;
      }
      if (found["real due date"] != null){ hr = r; cols = found; }
    }
    if (hr < 0) continue;
    const col = (...names) => { for (const n of names){ for (const k in cols) if (k === n || k.endsWith(n)) return cols[k]; } return undefined; };
    const C = {
      no: col("ticket number"), status: col("status"), due: col("real due date"),
      acc: col("account name"), city: col("city"), prod: col("product name"),
      type: col("ticket type"), who: col("assigned to"), id: col("id"),
      asm: col("asm"), link: col("ticket link"), serial: col("serial number")
    };
    const cell = (r, c) => c == null ? undefined : ws[XLSX.utils.encode_cell({r, c})];
    const txt = (r, c) => { const x = cell(r, c); return x && x.v != null ? String(x.w ?? x.v).trim() : ""; };
    const out = [];
    for (let r = hr + 1; r <= rng.e.r; r++){
      const dc = cell(r, C.due);
      const dt = parseDate(dc ? dc.v : null) || parseDate(dc ? dc.w : null);
      const no = txt(r, C.no);
      if (!dt || !no) continue;
      const bad = s => !s || /^#/.test(s) ? "" : s;
      const account = bad(txt(r, C.acc)), city = bad(txt(r, C.city)), product = bad(txt(r, C.prod));
      let link = safeUrl(txt(r, C.link));
      if (!link){
        const lc = cell(r, C.link), nc = cell(r, C.no);
        link = safeUrl(lc && lc.l && lc.l.Target) || safeUrl(nc && nc.l && nc.l.Target);
      }
      const id = txt(r, C.id);
      if (!link && CONFIG.LINK_TEMPLATE && id) link = safeUrl(CONFIG.LINK_TEMPLATE.replace("{id}", encodeURIComponent(id)));
      out.push({
        no, status: bad(txt(r, C.status)), type: bad(txt(r, C.type)),
        who: bad(txt(r, C.who)), asm: bad(txt(r, C.asm)), serial: bad(txt(r, C.serial)),
        account, city, product, link,
        summary: [account, city, product].filter(Boolean).join(" | "),
        y: dt.y, m: dt.m, d: dt.d, key: keyOf(dt.y, dt.m, dt.d), ok: keyOf(dt.y, dt.m, dt.d), row: r
      });
    }
    if (out.length){ out.meta = {sheet: name, dueC: C.due}; return out; }
  }
  throw new Error("Could not find a table with a \u201cReal Due date\u201d column in this file.");
}

function showMsg(t, info){
  const el = $("msg");
  if (!t){ el.style.display = "none"; return; }
  el.textContent = t; el.className = info ? "info" : ""; el.style.display = "block";
}

async function load(){
  $("updated").textContent = "Loading data\u2026";
  try {
    const U = MODES[CUR].url(), m = CUR, url = U + (U.includes("?") ? "&" : "?") + "t=" + Date.now();
    const res = await fetch(url, {cache: "no-store"});
    if (!res.ok) throw new Error("Could not download the Excel file (HTTP " + res.status + "). Check the file link in the page settings and that the repo is public.");
    const buf = await res.arrayBuffer();
    if (CUR !== m) return;
    FILE = decodeURIComponent(U.split("?")[0].split("/").pop());
    ingest(readWb(buf));
  } catch (e){
    showMsg((e && e.message ? e.message : e) + " You can also use \u201cOpen file\u2026\u201d to load the Excel from your computer.");
    $("updated").textContent = "Data not loaded";
  }
}

function ingest(wb){
  WB = wb; ALL = MODES[CUR].parse(wb); META = ALL.meta; STATE[CUR].loaded = true; if (CUR === "tasks") mergeLocal(); applyMoves();
  loadedAt = new Date();
  const noLink = CUR === "tickets" ? ALL.filter(t => !t.link).length : 0;
  showMsg(noLink ? noLink + " of " + ALL.length + " tickets have no usable link, so they are not clickable. Check the Ticket Link column in the Excel file." : "");
  fillFilters();
  $("updated").textContent = "Data refreshed " + loadedAt.toLocaleString([], {dateStyle: "medium", timeStyle: "short"});
  render();
}

let FILTERS = [], SEL = {}, CUR = "tickets", COLS = [];
const STATE = {}, NODATE = "0000-01-01";
const dueCell = t => fmtKey(t.key) + (t.moved ? ' <span class="mvt" title="was ' + fmtKey(t.ok) + '">moved</span>' : "");
const MODES = {
  tickets: {
    name: "Tickets", noun: "tickets", store: "mhs_moves", url: () => CONFIG.DATA_URL, parse: wb => parseWorkbook(wb),
    hint: "Search account, city, product, ticket\u2026",
    filters: [

/* ---- Tasks: read sheet "Task" (open tasks only) ---- */
function parseTasks(wb){
  const name = wb.SheetNames.find(n => n.trim().toLowerCase() === "task");
  if (!name) throw new Error("Sheet \u201cTask\u201d was not found in this file.");
  const ws = wb.Sheets[name], rng = XLSX.utils.decode_range(ws["!ref"]);
  let hr = -1, cols = {};
  for (let r = rng.s.r; r <= Math.min(rng.e.r, rng.s.r + 30) && hr < 0; r++){
    const found = {};
    for (let c = rng.s.c; c <= Math.min(rng.e.c, 30); c++){
      const x = ws[XLSX.utils.encode_cell({r, c})];
      if (x && x.v != null) found[String(x.v).replace(/\s+/g, " ").trim().toLowerCase()] = c;
    }
    if (found["next followup"] != null && found["request date"] != null){ hr = r; cols = found; }
  }
  if (hr < 0) throw new Error("Could not find the \u201cNext followup\u201d and \u201cRequest Date\u201d columns in the Task sheet.");
  const C = {req: cols["request date"], pf: cols["pending from"], asm: cols["asm"], sum: cols["task summary"], days: cols["pending for days"], due: cols["next followup"], st: cols["status"]};
  const cell = (r, c) => c == null ? undefined : ws[XLSX.utils.encode_cell({r, c})];
  const txt = (r, c) => { const x = cell(r, c); return x && x.v != null ? String(x.w ?? x.v).replace(/\s+/g, " ").trim() : ""; };
  const canon = {}, norm = (f, v) => v ? (canon[f + v.toLowerCase()] = canon[f + v.toLowerCase()] || v) : "";
  const now = new Date(), t0 = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()), out = [], seen = {};
  const dateOf = x => x && (parseDate(x.v) || parseDate(x.w));
  for (let r = hr + 1; r <= rng.e.r; r++){
    const summary = txt(r, C.sum);
    if (!summary || txt(r, C.st).toLowerCase() !== "open") continue;
    const rd = dateOf(cell(r, C.req)), dt = dateOf(cell(r, C.due));
    const req = rd ? keyOf(rd.y, rd.m, rd.d) : NODATE, key = dt ? keyOf(dt.y, dt.m, dt.d) : NODATE, p = key.split("-");
    let id = req + "|" + summary.toLowerCase(); seen[id] = (seen[id] || 0) + 1; if (seen[id] > 1) id += "#" + seen[id];
    out.push({kind: "task", no: id, summary, status: "Open", who: norm("a", txt(r, C.asm)), type: norm("p", txt(r, C.pf)),
      req, days: rd ? Math.max(0, Math.round((t0 - Date.UTC(rd.y, rd.m, rd.d)) / 864e5)) : 0,
      link: "", account: "", city: "", product: "", serial: "", asm: "", y: +p[0], m: p[1] - 1, d: +p[2], key, ok: key, row: r});
  }
  out.meta = {sheet: name, dueC: C.due, hr, C};
  return out;
}

function fillFilters(){

    if (!ch) break;

function monthHtml(y, m, by, todayKey){
  const lead = (new Date(y, m, 1).getDay() + 6) % 7, days = new Date(y, m + 1, 0).getDate();
  let html = "", n = 0; const all = [];
  for (let i = 0; i < lead; i++) html += '<div class="day pad"></div>';
  for (let d = 1; d <= days; d++){
    const k = keyOf(y, m, d), items = (by[k] || []).sort((a, b) => (a.who || "").localeCompare(b.who || ""));
    n += items.length; all.push(...items);
    const open = expanded.has(k), shown = open ? items : items.slice(0, 3);
    html += '<div class="day' + (k === todayKey ? " today" : "") + (k < todayKey ? " past" : "") + (items.length ? "" : " none") + '" data-k="' + k + '">' +
      '<div class="dn"><span>' + d + '<small class="wd"> ' + WD[new Date(y, m, d).getDay()] + '</small></span><span class="dr"><small>' + (items.length ? items.length : "") + "</small>" + (CUR === "tasks" && k >= todayKey ? '<button type="button" class="add" data-add="' + k + '" title="Add a task on this date" aria-label="Add a task">+</button>' : "") + "</span></div>" +
      shown.map(t => cardHtml(t, todayKey)).join("") +
      (items.length > 3 ? '<button class="more" data-k="' + k + '">' + (open ? "Show less" : "+" + (items.length - 3) + " more") + "</button>" : "") +
      "</div>";
  }
  return {html, n, all};
}

  if (STATE[CUR].loaded) for (const n in MOVES) if (!nos.has(n)){ delete MOVES[n]; dirty = true; }

    if (MOVES[t.no] === t.ok){ delete MOVES[t.no]; dirty = true; }
    const k = MOVES[t.no] || t.ok, p = k.split("-");
    t.moved = k !== t.ok; t.y = +p[0]; t.m = p[1] - 1; t.d = +p[2]; t.key = k;

  if (dirty) saveMoves();
  if (CUR === "tasks"){
    let dc = false;
    if (STATE[CUR].loaded) for (const n in CLOSED) if (!nos.has(n)){ delete CLOSED[n]; dc = true; }
    ALL.forEach(t => { t.cl = !!CLOSED[t.no]; });
    if (dc) saveClosed();
  }
}

  const c = e.target.closest && e.target.closest(".card"); if (!c) return;
  if (TOUCH){ e.preventDefault(); return; }
  dragNo = c.dataset.no; e.dataTransfer.setData("text/plain", dragNo); e.dataTransfer.effectAllowed = "move";
  setTimeout(() => c.classList.add("dragging"), 0);
});
g.addEventListener("dragend", () => { dragNo = null; document.querySelectorAll(".over,.dragging").forEach(x => x.classList.remove("over", "dragging")); });
g.addEventListener("dragover", e => {
  const d = dropCell(e); if (!d) return;
  e.preventDefault(); e.dataTransfer.dropEffect = "move";
  document.querySelectorAll(".over").forEach(x => x !== d && x.classList.remove("over"));
  d.classList.add("over");
});
g.addEventListener("drop", e => {
  const d = dropCell(e); if (!d) return;
  e.preventDefault();
  const no = dragNo; dragNo = null; moveTo(no, d.dataset.k);
});
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => e.preventDefault());

let tt = null, lastTouchAt = 0;
function cellAt(x, y){ const el = document.elementFromPoint(x, y), d = el && el.closest(".day[data-k]"); return d && d.dataset.k >= todayK() ? d : null; }
function endTouch(){
  if (!tt) return;
  clearTimeout(tt.timer); clearInterval(tt.scroll);
  if (tt.ghost) tt.ghost.remove();
  if (tt.card) tt.card.classList.remove("dragging");
  document.querySelectorAll(".over").forEach(x => x.classList.remove("over"));
  tt = null; dragNo = null;
}
g.addEventListener("touchstart", e => {
  lastTouchAt = Date.now();
  const c = e.target.closest && e.target.closest(".card");
  endTouch();
  if (!c || e.touches.length !== 1) return;
  const p = e.touches[0];
  tt = {card: c, x0: p.clientX, y0: p.clientY, x: p.clientX, y: p.clientY, armed: false};
  tt.timer = setTimeout(() => {
    if (!tt) return;
    tt.armed = true; dragNo = c.dataset.no; c.classList.add("dragging");
    const r = c.getBoundingClientRect(), gh = c.cloneNode(true);
    gh.classList.add("ghost");
    gh.style.cssText = "position:fixed;left:0;top:0;pointer-events:none;z-index:99;opacity:.92;width:" + r.width + "px;transform:translate(" + (tt.x - r.width / 2) + "px," + (tt.y - 24) + "px)";
    document.body.appendChild(gh); tt.ghost = gh; tt.w = r.width;
    if (navigator.vibrate) navigator.vibrate(40);
    tt.scroll = setInterval(() => { if (tt.y < 90) window.scrollBy(0, -14); else if (tt.y > innerHeight - 90) window.scrollBy(0, 14); }, 16);
  }, HOLD_MS);
}, {passive: true});
g.addEventListener("touchmove", e => {
  if (!tt) return;
  const p = e.touches[0]; tt.x = p.clientX; tt.y = p.clientY;
  if (!tt.armed){ if (Math.hypot(tt.x - tt.x0, tt.y - tt.y0) > 12){ clearTimeout(tt.timer); tt = null; } return; }
  e.preventDefault();
  tt.ghost.style.transform = "translate(" + (tt.x - tt.w / 2) + "px," + (tt.y - 24) + "px)";
  const d = cellAt(tt.x, tt.y);
  document.querySelectorAll(".over").forEach(x => x !== d && x.classList.remove("over"));
  if (d) d.classList.add("over");
}, {passive: false});
g.addEventListener("touchend", e => {
  if (!tt) return;
  if (tt.armed){
    e.preventDefault();
    const d = cellAt(tt.x, tt.y), no = dragNo;
    endTouch();
    if (d) moveTo(no, d.dataset.k);
  } else endTouch();
});
g.addEventListener("touchcancel", endTouch);
g.addEventListener("contextmenu", e => { if (Date.now() - lastTouchAt < 6000 && e.target.closest(".card")) e.preventDefault(); });
let resetArm = 0;
$("reset").onclick = () => {
  if (!resetArm){ resetArm = setTimeout(() => { resetArm = 0; $("reset").textContent = "Reset moves"; }, 3500); $("reset").textContent = "Click again to confirm"; return; }
  clearTimeout(resetArm); resetArm = 0; $("reset").textContent = "Reset moves";
  MOVES = {}; saveMoves(); applyMoves(); render();
};

/* ---- download Excel with the new Real Due dates ---- */
const MN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fixStructRefs(wb){
  let n = 0;
  wb.SheetNames.forEach(name => {
    const ws = wb.Sheets[name]; if (!ws || !ws["!ref"]) return;
    const rng = XLSX.utils.decode_range(ws["!ref"]), hdr = {};
    for (let r = rng.s.r; r <= Math.min(rng.e.r, rng.s.r + 12); r++)
      for (let c = rng.s.c; c <= rng.e.c; c++){
        const x = ws[XLSX.utils.encode_cell({r, c})];
        if (x && x.t === "s" && x.v != null){ const k = String(x.v).trim(); if (!(k in hdr)) hdr[k] = c; }
      }
    for (const a in ws){
      if (a[0] === "!") continue;
      const c = ws[a];
      if (c && typeof c.f === "string" && c.f.includes("[#This Row]")){
        const row = XLSX.utils.decode_cell(a).r + 1;
        c.f = c.f.replace(/[A-Za-z_][\w.]*\[\[#This Row\],\[([^\]]+)\]\]/g, (m, col) => (col in hdr) ? XLSX.utils.encode_col(hdr[col]) + row : m);
        n++;
      }
    }
  });
  return n;
}
function rewriteTaskSheet(sh, closedRows){
  const C = META.C, hr = META.hr, enc = XLSX.utils.encode_cell, rng = XLSX.utils.decode_range(sh["!ref"]);
  const val = x => x && x.v != null ? String(x.v).trim() : "";
  const serialOf = (y, m, d) => Math.round((Date.UTC(y, m, d) - Date.UTC(1899, 11, 30)) / 864e5);
  const now = new Date(), today = serialOf(now.getFullYear(), now.getMonth(), now.getDate());
  const keep = []; let removed = 0;
  for (let r = hr + 1; r <= rng.e.r; r++){
    const cells = {};
    for (let c = rng.s.c; c <= rng.e.c; c++){ const x = sh[enc({r, c})]; if (x){ cells[c] = x; delete sh[enc({r, c})]; } }
    const has = [C.req, C.pf, C.asm, C.sum, C.due, C.st].some(c => c != null && val(cells[c]) !== "");
    if (!has) continue;
    if (val(cells[C.st]).toLowerCase() === "closed" || closedRows.has(r)){ removed++; continue; }
    keep.push(cells);
  }
  const rc = XLSX.utils.encode_col(C.req);
  const daysCell = (r, reqSerial) => ({t: "n", v: reqSerial == null ? 0 : Math.max(0, today - reqSerial), f: 'IF(ISBLANK(' + rc + (r + 1) + '),"",TODAY()-' + rc + (r + 1) + ')'});
  keep.forEach((cells, i) => {
    const r = hr + 1 + i;
    for (const c in cells) sh[enc({r, c: +c})] = cells[c];
    if (C.days != null){ const q = cells[C.req]; sh[enc({r, c: C.days})] = daysCell(r, q && q.t === "n" ? q.v : null); }
  });
  const z = (keep[0] && keep[0][C.req] && keep[0][C.req].z) || "dd-mmm-yy", dp = k => { const p = k.split("-"); return serialOf(+p[0], p[1] - 1, +p[2]); };
  LOCAL.forEach((x, j) => {
    const r = hr + 1 + keep.length + j;
    if (C.req != null) sh[enc({r, c: C.req})] = {t: "n", v: dp(x.req), z};
    if (C.pf != null) sh[enc({r, c: C.pf})] = {t: "s", v: x.pf};
    if (C.asm != null) sh[enc({r, c: C.asm})] = {t: "s", v: x.asm};
    if (C.sum != null) sh[enc({r, c: C.sum})] = {t: "s", v: x.sum};
    if (C.due != null) sh[enc({r, c: C.due})] = {t: "n", v: dp(x.due), z};
    if (C.st != null) sh[enc({r, c: C.st})] = {t: "s", v: "Open"};
    if (C.days != null) sh[enc({r, c: C.days})] = daysCell(r, dp(x.req));
  });
  const last = Math.max(hr, hr + keep.length + LOCAL.length);
  sh["!ref"] = XLSX.utils.encode_range({s: rng.s, e: {r: last, c: rng.e.c}});
  return {added: LOCAL.length, removed};
}
$("dl").onclick = () => {
  if (!WB || !META){ showMsg("Load the data first."); return; }
  const sh = WB.Sheets[META.sheet]; let n = 0, extra = "";
  ALL.forEach(t => {
    if (!t.moved || t.local || t.cl) return;
    const a = XLSX.utils.encode_cell({r: t.row, c: META.dueC}), serial = Math.round((Date.UTC(t.y, t.m, t.d) - Date.UTC(1899, 11, 30)) / 864e5);
    let c = sh[a];
    if (!c || c.v == null || c.v === ""){ c = sh[a] = {t: "n", v: serial, z: "dd-mmm-yy"}; }
    else if (c.t === "n") c.v = serial;
    else { c.v = pad2(t.d) + "/" + MN[t.m] + "/" + (/\d{4}\s*$/.test(String(c.v)) ? t.y : String(t.y).slice(2)); c.t = "s"; }
    delete c.w; delete c.f; n++;
  });
  if (CUR === "tasks"){ const r = rewriteTaskSheet(sh, new Set(ALL.filter(t => t.cl && !t.local).map(t => t.row))); extra = " " + r.added + " new task(s) added, " + r.removed + " closed task(s) removed."; }
  const fx = fixStructRefs(WB);
  XLSX.writeFile(WB, FILE.replace(/\.xlsx?$/i, "") + "_updated.xlsx");
  showMsg(n + (CUR === "tasks" ? " follow-up" : " due") + " date(s) changed in the downloaded file." + extra + (fx ? " Excel table formulas were converted to normal cell formulas and table styling may be lost." : "") + " Upload it to GitHub to make the change permanent.", true);
};

/* ---- add / edit a task (Tasks mode) ---- */
let EDIT = null, EXIST = null, delArm = 0, CLOSED = {};
try { CLOSED = JSON.parse(localStorage.getItem("mhs_closed_tasks") || "{}"); } catch (e){}
function saveClosed(){ try { localStorage.setItem("mhs_closed_tasks", JSON.stringify(CLOSED)); } catch (e){} }
const tfBad = m => { $("tfErr").textContent = m; };
function fillLists(){
  const u = f => [...new Set(ALL.map(f).filter(Boolean))].sort(cmp).map(v => '<option value="' + esc(v) + '">').join("");
  $("dlPf").innerHTML = u(t => t.type); $("dlAsm").innerHTML = u(t => t.who);
}
function openForm(id, k){
  const loc = id ? LOCAL.find(l => l.id === id) : null, ex = id && !loc ? ALL.find(t => t.no === id && !t.local) : null;
  if (id && !loc && !ex) return;
  EDIT = loc ? loc.id : null; EXIST = ex ? ex.no : null; fillLists();
  ["tfReq", "tfPf", "tfAsm", "tfSum"].forEach(i => $(i).disabled = !!ex);
  $("tfTitle").textContent = loc ? "Edit task (new, not yet in Excel)" : ex ? "Update task" : "Add task";
  if (ex){
    $("tfReq").value = ex.req === NODATE ? "" : ex.req; $("tfPf").value = ex.type; $("tfAsm").value = ex.who;
    $("tfSum").value = ex.summary; $("tfDue").value = ex.key === NODATE ? "" : ex.key;
  } else {
    $("tfReq").value = loc ? loc.req : todayK(); $("tfPf").value = loc ? loc.pf : ""; $("tfAsm").value = loc ? loc.asm : "";
    $("tfSum").value = loc ? loc.sum : ""; $("tfDue").value = loc ? loc.due : k;
  }
  $("tfStW").hidden = !ex; $("tfSt").value = "Open"; $("tfStTxt").hidden = !!ex; $("tfClose").hidden = !ex;
  $("tfErr").textContent = ""; $("tfDel").hidden = !loc; $("tfDel").textContent = "Delete"; clearTimeout(delArm); delArm = 0;
  $("tf").hidden = false; (ex ? $("tfDue") : $("tfSum")).focus();
}
function closeForm(){ $("tf").hidden = true; EDIT = null; EXIST = null; }
function applyExisting(close){
  const t = ALL.find(x => x.no === EXIST && !x.local);
  if (!t){ closeForm(); return; }
  const due = $("tfDue").value;
  if (!close && !due) return tfBad("Please choose a next followup date, or mark the task closed.");
  if (close) CLOSED[t.no] = 1;
  else if (due !== t.ok) MOVES[t.no] = due; else delete MOVES[t.no];
  saveClosed(); saveMoves(); closeForm(); applyMoves(); fillFilters(); render();
}
$("tfClose").onclick = () => applyExisting(true);
$("tfCancel").onclick = closeForm;
$("tf").addEventListener("click", e => { if (e.target === $("tf")) closeForm(); });
$("tfSave").onclick = () => {
  if (EXIST){ applyExisting($("tfSt").value === "Closed"); return; }
  const req = $("tfReq").value, due = $("tfDue").value, sum = $("tfSum").value.replace(/\s+/g, " ").trim();
  if (!sum) return tfBad("Please enter the task summary.");
  if (!req || !due) return tfBad("Please choose the request date and the next followup date.");
  const match = (f, v) => { v = v.replace(/\s+/g, " ").trim(); return ALL.map(f).find(z => z && z.toLowerCase() === v.toLowerCase()) || v; };
  const rec = {req, pf: match(t => t.type, $("tfPf").value), asm: match(t => t.who, $("tfAsm").value), sum, due};
  const base = req + "|" + sum.toLowerCase(); let id = base, n = 1;
  while (LOCAL.some(l => l.id === id && l.id !== EDIT) || ALL.some(t => !t.local && t.no === id)) id = base + "#" + (++n);
  rec.id = id;
  const at = EDIT ? LOCAL.findIndex(l => l.id === EDIT) : -1;
  if (at >= 0) LOCAL[at] = rec; else LOCAL.push(rec);
  saveLocal(); closeForm(); rebuildLocal();
};
$("tfDel").onclick = () => {
  if (!EDIT) return;
  if (!delArm){ $("tfDel").textContent = "Click again to delete"; delArm = setTimeout(() => { delArm = 0; $("tfDel").textContent = "Delete"; }, 3500); return; }
  clearTimeout(delArm); delArm = 0;
  LOCAL = LOCAL.filter(l => l.id !== EDIT); saveLocal(); closeForm(); rebuildLocal();
};

/* ---- switching between Tickets and Tasks ---- */
function newState(m){
  const st = {ALL: [], WB: null, META: null, FILE: m + ".xlsx", MOVES: {}, SEL: {}, loadedAt: null, q: "", loaded: false};
  MODES[m].filters.forEach(f => st.SEL[f.k] = new Set());
  try { st.MOVES = JSON.parse(localStorage.getItem(MODES[m].store) || "{}"); } catch (e){}
  try {
    const sv = JSON.parse(localStorage.getItem("mhs_filters_" + m) || "{}");
    MODES[m].filters.forEach(f => (sv[f.k] || []).forEach(v => st.SEL[f.k].add(v)));
    st.q = sv.q || "";
  } catch (e){}
  return st;
}
function setMode(m, first){
  if (!first) Object.assign(STATE[CUR], {ALL, WB, META, FILE, MOVES, SEL, loadedAt, q: F.q});
  CUR = m;
  const st = STATE[m];
  ({ALL, WB, META, FILE, MOVES, SEL, loadedAt} = st);
  if (m === "tasks") ALL = ALL.filter(t => !t.local).concat(LOCAL.map(localObj));
  F.q = st.q; $("fQ").value = F.q; $("fQ").placeholder = MODES[m].hint;
  FILTERS = MODES[m].filters; COLS = MODES[m].cols;
  closeForm(); PANEL = null; PSORT = {k: "key", dir: 1}; $("panel").hidden = true; showMsg("");
  document.querySelectorAll("#modeSeg button").forEach(b => b.classList.toggle("on", b.dataset.m === m));
  try { localStorage.setItem("mhs_mode", m); } catch (e){}
  buildFilterUI(); fillFilters(); render();
  $("updated").textContent = loadedAt ? "Data refreshed " + loadedAt.toLocaleString([], {dateStyle: "medium", timeStyle: "short"}) : "Loading data\u2026";
  if (!st.loaded || (CONFIG.REFRESH_MIN > 0 && Date.now() - loadedAt > CONFIG.REFRESH_MIN * 60000)) load();
}
$("modeSeg").addEventListener("click", e => { const b = e.target.closest("button[data-m]"); if (b && b.dataset.m !== CUR) setMode(b.dataset.m); });
STATE.tickets = newState("tickets"); STATE.tasks = newState("tasks");
let startMode = "tickets"; try { const sm = localStorage.getItem("mhs_mode"); if (MODES[sm]) startMode = sm; } catch (e){}
setMode(startMode, true);
if (CONFIG.REFRESH_MIN > 0) setInterval(load, CONFIG.REFRESH_MIN * 60000);
